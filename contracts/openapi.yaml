openapi: 3.1.0
info:
  title: Startup Team MVP API
  version: 0.4.0
  description: Prototype contract for the selected 12-feature scope; see docs/IMPLEMENTATION_STATUS.md for verification limits.
servers:
- url: /api/v1
tags:
- name: auth
- name: users
- name: startups
- name: vacancies
- name: applications
- name: offers
- name: team
- name: recruiters
- name: tests
- name: notifications
- name: history
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id: &id001
              type: string
              format: uuid
          required:
          - code
          - message
          - details
          - request_id
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    User:
      type: object
      properties:
        id: *id001
        name:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        portfolio_url:
          anyOf:
          - &id007
            type: string
            format: uri
          - type: 'null'
      required:
      - id
      - name
      - bio
      - skills
      additionalProperties: false
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
      additionalProperties: false
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        bio:
          type: string
          maxLength: 5000
        skills:
          type: array
          items:
            type: string
        portfolio_url:
          anyOf:
          - type: string
            format: uri
            pattern: ^https?://
          - type: 'null'
      required: []
      additionalProperties: false
    StartupCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
        allow_general_applications: &id002
          type: boolean
      required:
      - title
      additionalProperties: false
    StartupUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
        allow_general_applications: *id002
      required: []
      additionalProperties: false
    Startup:
      type: object
      properties:
        id: *id001
        owner_id: *id001
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - active
          - paused
          - archived
        allow_general_applications: *id002
        revision: &id004
          type: integer
      required:
      - id
      - owner_id
      - title
      - description
      - status
      - allow_general_applications
      - revision
      additionalProperties: false
    VacancyCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
        requirements:
          type: string
        positions_count:
          type: integer
          minimum: 1
        application_deadline: &id003
          type: string
          format: date-time
      required:
      - title
      - positions_count
      - application_deadline
      additionalProperties: false
    VacancySettings:
      type: object
      properties:
        positions_count:
          type: integer
          minimum: 1
        application_deadline: *id003
      required: []
      additionalProperties: false
    VacancyChange:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
        requirements:
          type: string
        change_mode:
          type: string
          enum:
          - keep_applications
          - reset_applications
        reason:
          type: string
      required:
      - title
      - change_mode
      additionalProperties: false
    Vacancy:
      type: object
      properties:
        id: *id001
        startup_id: *id001
        title:
          type: string
        description:
          type: string
        requirements:
          type: string
        positions_count: *id004
        application_deadline: *id003
        status:
          type: string
          enum:
          - published
          - intake_closed
          - archived
        current_version: *id004
        revision: *id004
        owner_id: *id001
        startup_status:
          type: string
      required:
      - id
      - startup_id
      - title
      - description
      - requirements
      - positions_count
      - application_deadline
      - status
      - current_version
      - revision
      additionalProperties: false
    VacancyVersion:
      type: object
      properties:
        id: *id001
        vacancy_id: *id001
        version: *id004
        title:
          type: string
        description:
          type: string
        requirements:
          type: string
        change_mode:
          type: string
        created_at: *id003
      required:
      - id
      - vacancy_id
      - version
      - title
      - description
      - requirements
      - change_mode
      - created_at
      additionalProperties: false
    Capacity:
      type: object
      properties:
        positions_count: *id004
        occupied: *id004
        reserved: *id004
        available: *id004
      required:
      - positions_count
      - occupied
      - reserved
      - available
      additionalProperties: false
    ApplicationCreate:
      type: object
      properties:
        target_type:
          type: string
          enum:
          - vacancy
          - startup
        target_id: *id001
        message:
          type: string
          maxLength: 5000
      required:
      - target_type
      - target_id
      additionalProperties: false
    Application:
      type: object
      properties:
        id: *id001
        startup_id: *id001
        vacancy_id:
          anyOf:
          - *id001
          - type: 'null'
        applicant_id: *id001
        attempt_id: *id001
        status:
          type: string
          enum:
          - pending
          - reviewing
          - offer_pending
          - rejected
          - withdrawn
          - reset
          - joined
          - declined
          - already_joined
          - closed
        message:
          type: string
        revision: *id004
        created_at: *id003
        vacancy_version_id: &id005
          anyOf:
          - *id001
          - type: 'null'
        rejection_reason:
          type: string
        startup_title:
          type: string
        applicant_name:
          type: string
        vacancy_title: &id006
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - startup_id
      - applicant_id
      - attempt_id
      - status
      - message
      - revision
      - created_at
      additionalProperties: false
    AttemptCreate:
      type: object
      properties:
        message:
          type: string
          maxLength: 5000
      required: []
      additionalProperties: false
    RejectBody:
      type: object
      properties:
        reason:
          type: string
          maxLength: 2000
      required: []
      additionalProperties: false
    OfferCreate:
      type: object
      properties:
        expires_at: *id003
        message:
          type: string
          maxLength: 5000
      required:
      - expires_at
      additionalProperties: false
    Offer:
      type: object
      properties:
        id: *id001
        startup_id: *id001
        candidate_id: *id001
        vacancy_id:
          anyOf:
          - *id001
          - type: 'null'
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - revoked
          - expired
        expires_at: *id003
        revision: *id004
        attempt_id: *id001
        vacancy_version_id: *id005
        message:
          type: string
        startup_title:
          type: string
        vacancy_title: *id006
        vacancy_description: *id006
        vacancy_requirements: *id006
      required:
      - id
      - startup_id
      - candidate_id
      - status
      - expires_at
      - revision
      additionalProperties: false
    Member:
      type: object
      properties:
        id: *id001
        startup_id: *id001
        user_id: *id001
        joined_at: *id003
        left_at:
          anyOf:
          - *id003
          - type: 'null'
      required:
      - id
      - startup_id
      - user_id
      - joined_at
      additionalProperties: false
    RecruiterInvitationCreate:
      type: object
      properties:
        user_id: *id001
        expires_at: *id003
      required:
      - user_id
      - expires_at
      additionalProperties: false
    RecruiterInvitation:
      type: object
      properties:
        id: *id001
        startup_id: *id001
        user_id: *id001
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - revoked
          - expired
        expires_at: *id003
      required:
      - id
      - startup_id
      - user_id
      - status
      - expires_at
      additionalProperties: false
    RecruiterGrant:
      type: object
      properties:
        id: *id001
        startup_id: *id001
        user_id: *id001
        granted_at: *id003
      required:
      - id
      - startup_id
      - user_id
      - granted_at
      additionalProperties: false
    TestVersionCreate:
      type: object
      properties:
        description:
          type: string
          minLength: 1
        submission_deadline: *id003
        change_type:
          type: string
          enum:
          - initial
          - ordinary
          - critical
        reason:
          type: string
      required:
      - description
      - submission_deadline
      - change_type
      additionalProperties: false
    TestVersion:
      type: object
      properties:
        id: *id001
        vacancy_id: *id001
        version: *id004
        description:
          type: string
        submission_deadline: *id003
        change_type:
          type: string
      required:
      - id
      - vacancy_id
      - version
      - description
      - submission_deadline
      - change_type
      additionalProperties: false
    TestSubmissionCreate:
      type: object
      properties:
        test_version_id: *id001
        solution_url:
          type: string
          format: uri
          pattern: ^https://
      required:
      - test_version_id
      - solution_url
      additionalProperties: false
    TestSubmission:
      type: object
      properties:
        id: *id001
        attempt_id: *id001
        test_version_id: *id001
        solution_url: *id007
        status:
          type: string
          enum:
          - submitted
          - reviewed
          - superseded
        submitted_at: *id003
      required:
      - id
      - attempt_id
      - test_version_id
      - solution_url
      - status
      - submitted_at
      additionalProperties: false
    TestReview:
      type: object
      properties:
        status:
          type: string
          const: reviewed
      required:
      - status
      additionalProperties: false
    Notification:
      type: object
      properties:
        id: *id001
        title:
          type: string
        message:
          type: string
        read_at:
          anyOf:
          - *id003
          - type: 'null'
        created_at: *id003
      required:
      - id
      - title
      - message
      - created_at
      additionalProperties: false
    Event:
      type: object
      properties:
        id: *id001
        event_type:
          type: string
        entity_type:
          type: string
        entity_id: *id001
        created_at: *id003
        metadata:
          type: object
          additionalProperties: true
        actor_name: *id006
      required:
      - id
      - event_type
      - entity_type
      - entity_id
      - created_at
      additionalProperties: false
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
      additionalProperties: false
    ListStartup:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Startup'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListVacancy:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vacancy'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListApplication:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListOffer:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListMember:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListRecruiterInvitation:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecruiterInvitation'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListRecruiterGrant:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecruiterGrant'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListVacancyVersion:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VacancyVersion'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListTestVersion:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestVersion'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListTestSubmission:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestSubmission'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListNotification:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListEvent:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    Attempt:
      type: object
      properties:
        id: *id001
        application_id: *id001
        status:
          type: string
        message:
          type: string
        rejection_reason:
          type: string
        is_current: *id002
        vacancy_version_id: *id005
        created_at: *id003
        vacancy_version:
          anyOf:
          - *id004
          - type: 'null'
        title: *id006
        description: *id006
        requirements: *id006
      required:
      - id
      - application_id
      - status
      - message
      - rejection_reason
      - is_current
      - created_at
      additionalProperties: false
    ListAttempt:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    ListUser:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
paths:
  /auth/login:
    post:
      operationId: post_auth_login
      tags:
      - auth
      summary: Войти
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Idempotency-Replayed:
              schema:
                type: string
              description: true for replay of an actor-bound stored command result
        '400':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: post_auth_logout
      tags:
      - auth
      summary: Выйти
      security:
      - sessionCookie: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 8
          maxLength: 120
        description: Optional command receipt key. Reuse the same key after a lost response; same actor/key with a different
          path, body or If-Match returns 409. Successful effects and receipts commit atomically.
      responses:
        '204':
          description: Success, no response body
        '400':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      operationId: get_auth_me
      tags:
      - auth
      summary: Текущий пользователь
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/csrf:
    get:
      operationId: get_auth_csrf
      tags:
      - auth
      summary: CSRF токен
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '400':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{user_id}:
    get:
      operationId: get_users_user_id
      tags:
      - users
      summary: Публичный профиль
      security:
      - sessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me:
    patch:
      operationId: patch_users_me
      tags:
      - users
      summary: Изменить свой профиль
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 8
          maxLength: 120
        description: Optional command receipt key. Reuse the same key after a lost response; same actor/key with a different
          path, body or If-Match returns 409. Successful effects and receipts commit atomically.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Idempotency-Replayed:
              schema:
                type: string
              description: true for replay of an actor-bound stored command result
        '400':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
