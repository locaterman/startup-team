services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-startup}
      POSTGRES_DB: startup
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup -d startup"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://startup:${POSTGRES_PASSWORD:-startup}@db:5432/startup
      CSRF_SECRET: ${CSRF_SECRET:-replace-with-long-random-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-300}
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-true}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-true}
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
volumes:
  postgres_data:
